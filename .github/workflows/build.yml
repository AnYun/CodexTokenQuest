name: Windows and macOS
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build CodexTokenQuest.slnx --configuration Release
      - run: dotnet run --project tests/CodexTokenQuest.Tests --configuration Release --no-build -- --render
      - uses: actions/upload-artifact@v4
        with:
          name: hud-previews-${{ matrix.os }}
          path: artifacts/qa
